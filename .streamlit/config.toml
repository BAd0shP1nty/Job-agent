[theme]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[server]
maxUploadSize = 5
# Only reachable from this computer (the app holds your resume). Remove to share on your network.
address = "127.0.0.1"
# Open the browser automatically when the app starts.
headless = false

[browser]
gatherUsageStats = false
