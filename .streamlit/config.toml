[theme]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[server]
maxUploadSize = 5
# Only reachable from this computer (the app holds your resume). Remove to share on your network.
address = "127.0.0.1"
# Headless avoids Streamlit's first-run e-mail prompt, which blocks start-up until answered.
# Open http://127.0.0.1:8501 in your browser after starting the app.
headless = true

[browser]
gatherUsageStats = false
